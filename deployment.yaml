apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotstar-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hotstar
  template:
    metadata:
      labels:
        app: hotstar
    spec:
      containers:
      - name: hotstar
        image: natsucloud/hotstar:latest
        command: ["sh", "-c"]
        args: ["java -jar app.jar && tail -f /dev/null"]
        ports:
        - containerPort: 8080
